<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บัตรของฉัน</title>
<meta name="description" content="รวมบัตรเครดิตทุกธนาคาร สรุปการใช้จ่าย การผ่อนชำระ ยอดค้างชำระ วันตัดรอบ วันครบกำหนด และแจ้งเตือน">
<meta name="theme-color" content="#1e40af">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="บัตรของฉัน">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f5f9; --surface: #ffffff; --surface-2: #f8fafc; --text: #0f172a; --muted: #64748b;
  --border: #e2e8f0; --primary: #1e40af; --primary-soft: #dbeafe; --on-primary: #ffffff;
  --danger: #dc2626; --danger-soft: #fee2e2; --warn: #b45309; --warn-soft: #fef3c7;
  --ok: #15803d; --ok-soft: #dcfce7; --shadow: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120; --surface: #131c2e; --surface-2: #1a2438; --text: #e2e8f0; --muted: #94a3b8;
    --border: #26324a; --primary: #60a5fa; --primary-soft: #1e3a5f; --on-primary: #0b1120;
    --danger: #f87171; --danger-soft: #3f1d1d; --warn: #fbbf24; --warn-soft: #3d2f10;
    --ok: #4ade80; --ok-soft: #12321f; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120; --surface: #131c2e; --surface-2: #1a2438; --text: #e2e8f0; --muted: #94a3b8;
  --border: #26324a; --primary: #60a5fa; --primary-soft: #1e3a5f; --on-primary: #0b1120;
  --danger: #f87171; --danger-soft: #3f1d1d; --warn: #fbbf24; --warn-soft: #3d2f10;
  --ok: #4ade80; --ok-soft: #12321f; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent;
}
header.top {
  position: sticky; top: 0; z-index: 10; background: var(--surface);
  border-bottom: 1px solid var(--border); padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display: flex; align-items: center; gap: 10px;
}
header.top h1 { font-size: 18px; margin: 0; flex: 1; }
header.top .date { color: var(--muted); font-size: 13px; }
main { max-width: 720px; margin: 0 auto; padding: 14px 16px calc(90px + env(safe-area-inset-bottom)); }
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; background: var(--surface);
  border-top: 1px solid var(--border); display: flex; padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-size: 11.5px;
  padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer;
}
nav.tabs button .ic { font-size: 20px; line-height: 1.2; filter: grayscale(1); opacity: .7; }
nav.tabs button.on { color: var(--primary); font-weight: 600; }
nav.tabs button.on .ic { filter: none; opacity: 1; }
h2 { font-size: 16px; margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
h2 .sp { flex: 1; }
h2:first-child { margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.pad { padding: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { padding: 12px 14px; }
.tile .lbl { color: var(--muted); font-size: 12.5px; }
.tile .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; word-break: break-all; }
.tile .sub { color: var(--muted); font-size: 12px; }
.list > .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--border); }
.list > .row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--muted); font-size: 12.5px; }
.row .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.clickable { cursor: pointer; }
.chip {
  min-width: 40px; padding: 0 5px; height: 28px; border-radius: 6px; color: #fff; font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; flex: none; letter-spacing: .2px;
}
.badge { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-info { background: var(--primary-soft); color: var(--primary); }
.b-muted { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.alert { border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; font-size: 14px; }
.alert.danger { background: var(--danger-soft); color: var(--danger); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.info { background: var(--primary-soft); color: var(--primary); }
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px;
  padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.empty { text-align: center; color: var(--muted); padding: 26px 16px; }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.bar.warn > i { background: var(--warn); }
.bar.danger > i { background: var(--danger); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
.seg button { flex: none; }
.seg .on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.cc {
  border-radius: 14px; padding: 14px 16px; color: #fff; position: relative; overflow: hidden; cursor: pointer;
  min-height: 118px; display: flex; flex-direction: column; justify-content: space-between; margin-bottom: 10px;
}
.cc::after { content: ''; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.12); }
.cc .top { display: flex; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
.cc .bank { font-size: 12.5px; opacity: .9; }
.cc .nm { font-weight: 700; font-size: 16px; }
.cc .num { letter-spacing: 2px; font-variant-numeric: tabular-nums; opacity: .95; }
.cc .bot { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; font-size: 12.5px; position: relative; z-index: 1; flex-wrap: wrap; }
.cc .pill { background: rgba(255,255,255,.22); border-radius: 99px; padding: 2px 10px; font-weight: 600; }
dialog#sheet {
  border: 0; padding: 0; width: 100%; max-width: 560px; max-height: 92vh; border-radius: 18px 18px 0 0;
  margin: auto auto 0; background: var(--surface); color: var(--text);
}
@media (min-width: 600px) { dialog#sheet { border-radius: 18px; margin: auto; } }
dialog#sheet::backdrop { background: rgba(2,6,23,.55); }
.sheet-h { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.sheet-h b { flex: 1; font-size: 16px; }
.sheet-b { padding: 14px 16px 22px; }
.x { border: 0; background: var(--surface-2); color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
label.f { display: block; margin-bottom: 12px; font-size: 13.5px; color: var(--muted); }
label.f > span { display: block; margin-bottom: 4px; }
input, select, textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
}
textarea { min-height: 120px; font-size: 14px; font-family: ui-monospace, monospace; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; margin: 0 6px 0 0; accent-color: var(--primary); }
.check { display: flex; align-items: center; margin-bottom: 12px; font-size: 15px; color: var(--text); }
.hint { font-size: 12.5px; color: var(--muted); margin: -6px 0 12px; }
.catbar { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--border); }
.catbar:first-child { border-top: 0; }
.catbar .bar { grid-column: 1 / -1; }
.months { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 10px 14px 0; }
.months .m { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.months .m i { width: 100%; max-width: 34px; background: var(--primary); border-radius: 6px 6px 2px 2px; min-height: 2px; opacity: .85; }
.months .m.cur i { opacity: 1; }
.months .m span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.months-v { display: flex; gap: 6px; padding: 0 14px 10px; }
.months-v span { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; }
.fab {
  position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 11;
  width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--primary); color: var(--on-primary);
  font-size: 30px; line-height: 1; cursor: pointer; box-shadow: 0 6px 18px rgba(30,64,175,.35);
}
.fab[hidden] { display: none; }
.toast {
  position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: #0f172a; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 50;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px);
}
.tl { position: relative; }
.tl .row { align-items: flex-start; }
.tl .dt { width: 48px; text-align: center; flex: none; }
.tl .dt b { display: block; font-size: 18px; line-height: 1.1; }
.tl .dt small { color: var(--muted); font-size: 11px; }
code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px; font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <h1>💳 บัตรของฉัน</h1>
  <span class="date" id="today"></span>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="home"><span class="ic">🏠</span>ภาพรวม</button>
  <button data-tab="cards"><span class="ic">💳</span>บัตร</button>
  <button data-tab="inst"><span class="ic">📆</span>ผ่อนชำระ</button>
  <button data-tab="txn"><span class="ic">🧾</span>ใช้จ่าย</button>
  <button data-tab="settings"><span class="ic">⚙️</span>ตั้งค่า</button>
</nav>
<button class="fab" id="fab" data-act="txn-add" aria-label="บันทึกการใช้จ่าย" hidden>＋</button>
<dialog id="sheet"></dialog>

<script>
'use strict';
/* ============================== ค่าคงที่ ============================== */
const ISSUERS = {
  kbank: { name: 'กสิกรไทย', app: 'K PLUS / UCHOOSE', short: 'KBank', color: '#00a651' },
  scb:   { name: 'ไทยพาณิชย์ / CardX', app: 'SCB EASY / CardX', short: 'SCB', color: '#4e2a84' },
  ktc:   { name: 'เคทีซี (KTC)', app: 'KTC Mobile', short: 'KTC', color: '#d71920' },
  ttb:   { name: 'ทีทีบี (ttb)', app: 'ttb touch', short: 'ttb', color: '#0b4ea2' },
  uob:   { name: 'ยูโอบี (UOB)', app: 'UOB TMRW', short: 'UOB', color: '#0b2f6b' },
  bbl:   { name: 'กรุงเทพ', app: 'Bangkok Bank', short: 'BBL', color: '#1e4598' },
  spay:  { name: 'ShopeePay / SPayLater', app: 'ShopeePay', short: 'SPay', color: '#ee4d2d' },
  homepro: { name: 'HomePro', app: '', short: 'HomePro', color: '#0a5fb4' },
  central: { name: 'Central', app: '', short: 'Central', color: '#b8102b' },
  lazada:  { name: 'Lazada', app: '', short: 'Lazada', color: '#2e1a8c' },
  other: { name: 'อื่นๆ', app: '', short: 'อื่น', color: '#475569' },
};
const CATS = [
  { id: 'food', label: '🍜 อาหาร/เครื่องดื่ม', re: /grab ?food|line ?man|foodpanda|robinhood|starbucks|caf[eé]|coffee|kfc|mcdonald|\bmk\b|restaurant|ร้านอาหาร|กาแฟ|ชาบู|swensen|after you|bonchon|amazon cafe|pizza|sushi/i },
  { id: 'grocery', label: '🛒 ซูเปอร์มาร์เก็ต/สะดวกซื้อ', re: /7-?eleven|7-11|lotus|big ?c|makro|\btops\b|gourmet|villa market|family ?mart|lawson|\bcj\b|foodland|max ?valu/i },
  { id: 'online', label: '📦 ช้อปออนไลน์', re: /shopee|lazada|amazon|aliexpress|temu|tiktok|nocnoc/i },
  { id: 'travel', label: '⛽ เดินทาง/น้ำมัน', re: /\bptt\b|shell|caltex|bangchak|บางจาก|esso|\bgrab\b|bolt|\bbts\b|\bmrt\b|easy ?pass|m-?flow|ทางด่วน|parking|ที่จอด|น้ำมัน/i },
  { id: 'bills', label: '💡 บิล/มือถือ/ประกัน', re: /\bais\b|true ?move|dtac|3bb|การไฟฟ้า|\bpea\b|\bmea\b|ประปา|insurance|ประกัน|internet|fiber/i },
  { id: 'pet', label: '🐾 สัตว์เลี้ยง', re: /\bpet|สัตว์|\bvet\b/i },
  { id: 'health', label: '💊 สุขภาพ/ความงาม', re: /hospital|โรงพยาบาล|clinic|คลินิก|pharma|ร้านยา|boots|watsons|eveandboy|fitness|ฟิตเนส/i },
  { id: 'ent', label: '🎬 บันเทิง/สมาชิก', re: /netflix|spotify|youtube|apple\.com|itunes|google|disney|hbo|major|sf cinema|steam|playstation|\bviu\b|wetv|true ?id|chatgpt|openai|anthropic|claude/i },
  { id: 'trip', label: '✈️ ท่องเที่ยว/ที่พัก', re: /agoda|booking\.com|airasia|thai ?airways|nok ?air|lion ?air|vietjet|hotel|โรงแรม|resort|airbnb|trip\.com|klook/i },
  { id: 'shop', label: '🛍️ ช้อปปิ้ง/ห้าง/บ้าน', re: /central|robinson|the mall|emporium|uniqlo|h&m|zara|ikea|homepro|power ?buy|banana|jaymart|paragon|index living|boonthavorn|ไทวัสดุ|thai ?watsadu|global ?house/i },
  { id: 'edu', label: '📚 การศึกษา/หนังสือ', re: /school|โรงเรียน|มหาวิทยาลัย|university|course|udemy|coursera|นายอินทร์|se-ed|kinokuniya/i },
  { id: 'other', label: '📌 อื่นๆ', re: null },
];
// บัตรที่ใช้อยู่จริง (วันตัดรอบ/ครบกำหนดให้ผู้ใช้ตั้งเอง)
const CAT_BY_ID = Object.fromEntries(CATS.map((c) => [c.id, c]));
const STORE_KEY = 'mycards.v1';
const DAY = 86400000;
const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

/* ============================== ข้อมูล ============================== */
function blankState() {
  return {
    version: 1, cards: [], statements: [], installments: [], txns: [],
    settings: { remindDays: [5, 3, 1, 0], notified: {}, gasUrl: '', syncKey: '', lastSync: '', lastSyncError: '', lastCardId: '' },
  };
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.cards)) {
      const b = blankState();
      return Object.assign(b, s, { settings: Object.assign(b.settings, s.settings || {}) });
    }
  } catch (e) { /* ใช้ค่าเริ่มต้น */ }
  return blankState();
}
let state = loadState();
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast('⚠️ บันทึกข้อมูลไม่สำเร็จ'); }
}
function save(opts = {}) {
  persist();
  if (!opts.noSync) scheduleSync();
  render();
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cardById = (id) => state.cards.find((c) => c.id === id);
/** บัตรที่ตั้งวันตัดรอบ/วันครบกำหนดแล้ว จึงคำนวณรอบบิลได้ */
const hasDates = (c) => !!(c && c.statementDay && c.dueDay);
const datedCards = () => state.cards.filter(hasDates);

const b64d = (x) => Uint8Array.from(atob(x), (c) => c.charCodeAt(0));
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
async function pbkdf2(password, salt, iter, usage) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey', 'deriveBits']);
  if (usage === 'bits') return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, 256);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function unsealData(password) {
  const key = await pbkdf2(password, b64d(SEALED.salt), SEALED.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(SEALED.iv) }, key, b64d(SEALED.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function lockHash(password, saltHex) {
  const salt = Uint8Array.from(saltHex.match(/../g).map((h) => parseInt(h, 16)));
  return hex(await pbkdf2(password, salt, 150000, 'bits'));
}
async function setLockPassword(password) {
  const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
  state.settings.lock = { salt, hash: await lockHash(password, salt), enabled: true };
  persist();
}
function isUnlocked() { try { return sessionStorage.getItem('mycards.unlocked') === '1'; } catch (e) { return false; } }
function markUnlocked() { try { sessionStorage.setItem('mycards.unlocked', '1'); } catch (e) { /* ignore */ } unlockedMem = true; }
let unlockedMem = false;
const isLocked = () => !!(state.settings.lock && state.settings.lock.enabled && !isUnlocked() && !unlockedMem);
function renderLock() {
  return `<div class="card pad" style="text-align:center;margin-top:30px">
    <div style="font-size:44px">🔒</div>
    <h2 style="justify-content:center">แอปถูกล็อก</h2>
    <form id="unlockForm" autocomplete="off">
      <input type="password" id="unlockPw" placeholder="รหัสผ่าน" autofocus style="text-align:center;font-size:20px;margin-bottom:10px">
      <button class="btn primary block" type="submit">ปลดล็อก</button>
    </form></div>`;
}
function unsealCard() {
  if (!SEALED) return '';
  return `<div class="card pad" style="margin-bottom:12px">
    <b>🔐 โหลดข้อมูลบัตรของฉัน</b>
    <p class="small muted" style="margin:4px 0 10px">ข้อมูลบัตร วันตัดรอบ รายการผ่อน และยอดรอบปัจจุบัน ถูกเข้ารหัสไว้ — ใส่รหัสผ่านเพื่อโหลดเข้าเครื่องนี้</p>
    <form id="unsealForm" autocomplete="off">
      <input type="password" id="unsealPw" placeholder="รหัสผ่าน" style="margin-bottom:10px">
      <button class="btn primary block" type="submit">โหลดข้อมูล</button>
    </form></div>`;
}
document.addEventListener('submit', async (e) => {
  if (e.target.id === 'unlockForm') {
    e.preventDefault();
    const pw = document.getElementById('unlockPw').value, L = state.settings.lock;
    if (L && (await lockHash(pw, L.salt)) === L.hash) { markUnlocked(); render(); checkNotifications(); }
    else { toast('รหัสผ่านไม่ถูกต้อง'); document.getElementById('unlockPw').select(); }
  }
  if (e.target.id === 'unsealForm') {
    e.preventDefault();
    const pw = document.getElementById('unsealPw').value;
    try {
      const data = await unsealData(pw);
      const b = blankState();
      state = Object.assign(b, data, { settings: Object.assign(b.settings, data.settings || {}) });
      await setLockPassword(pw);
      markUnlocked();
      save({ noSync: true });
      toast(`โหลดข้อมูลแล้ว: ${state.cards.length} บัตร · ผ่อน ${state.installments.length} · รายการ ${state.txns.length}`);
    } catch (err) { toast('รหัสผ่านไม่ถูกต้อง'); }
  }
});

/* ============================== วันที่ ============================== */
const pad = (n) => String(n).padStart(2, '0');
function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseIso(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d || 1); }
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function clampDate(y, m, d) {
  const first = new Date(y, m, 1);
  return new Date(first.getFullYear(), first.getMonth(), Math.min(d, daysInMonth(first.getFullYear(), first.getMonth())));
}
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function daysBetween(a, b) { return Math.round((b - a) / DAY); }
/** วันตัดรอบของบัตรในเดือน (y, m) */
function stmtDate(card, y, m) { return clampDate(y, m, card.statementDay); }
/** วันครบกำหนดชำระของรอบบิลที่ตัดในวัน S (วันครบกำหนดแรกที่อยู่หลังวันตัดรอบ) */
function dueFor(card, S) {
  let d = clampDate(S.getFullYear(), S.getMonth(), card.dueDay);
  if (d <= S) d = clampDate(S.getFullYear(), S.getMonth() + 1, card.dueDay);
  return d;
}
/** รอบบิลล่าสุดที่ตัดไปแล้ว (รวมวันนี้) */
function lastStmt(card, t = today()) {
  let s = stmtDate(card, t.getFullYear(), t.getMonth());
  if (s > t) s = stmtDate(card, t.getFullYear(), t.getMonth() - 1);
  return s;
}
/** รอบบิลที่รายการซึ่งรูดในวัน t จะไปอยู่ */
function stmtForPurchase(card, t) {
  let s = stmtDate(card, t.getFullYear(), t.getMonth());
  if (s < t) s = stmtDate(card, t.getFullYear(), t.getMonth() + 1);
  return s;
}
function shiftCycle(card, S, n) { return stmtDate(card, S.getFullYear(), S.getMonth() + n); }
function cycleKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function keyToStmt(card, key) { const [y, m] = key.split('-').map(Number); return stmtDate(card, y, m - 1); }
function monthsDiff(fromKey, toKey) {
  const [y1, m1] = fromKey.split('-').map(Number), [y2, m2] = toKey.split('-').map(Number);
  return (y2 - y1) * 12 + (m2 - m1);
}
function addMonthsKey(key, n) { const [y, m] = key.split('-').map(Number); return cycleKey(new Date(y, m - 1 + n, 1)); }
function fmtD(d) { return d.getDate() + ' ' + TH_MONTHS[d.getMonth()]; }
function fmtDY(d) { return fmtD(d) + ' ' + String(d.getFullYear() + 543).slice(2); }
function fmtKey(key) { const [y, m] = key.split('-').map(Number); return TH_MONTHS[m - 1] + ' ' + String(y + 543).slice(2); }
function relDays(n) {
  if (n === 0) return 'วันนี้';
  if (n === 1) return 'พรุ่งนี้';
  if (n > 1) return 'อีก ' + n + ' วัน';
  return 'เลยมา ' + (-n) + ' วัน';
}

/* ============================== รูปแบบ ============================== */
const moneyFmt = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const moneyFmt2 = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => { const v = Math.round((Number(n) || 0) * 100) / 100; return '฿' + (Number.isInteger(v) ? moneyFmt : moneyFmt2).format(v); };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const issuerOf = (card) => ISSUERS[card.issuer] || ISSUERS.other;
function cardLabel(card) {
  const is = issuerOf(card), n = String(card.name || '');
  const dup = [is.short, is.name].some((x) => n.toLowerCase().includes(x.toLowerCase())) || n.toLowerCase().includes('spay');
  return (dup ? n : is.short + ' ' + n) + (card.last4 ? ' ••' + card.last4 : '');
}
function chip(card) {
  const is = issuerOf(card);
  return `<span class="chip" style="background:${card.color || is.color}">${esc(is.short)}</span>`;
}
function guessCat(desc) {
  for (const c of CATS) if (c.re && c.re.test(desc || '')) return c.id;
  return 'other';
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ============================== คำนวณ ============================== */
function findStmt(cardId, key) { return state.statements.find((s) => s.cardId === cardId && s.cycle === key); }

function instStatus(p, t = today()) {
  const card = cardById(p.cardId);
  const curKey = hasDates(card) ? cycleKey(lastStmt(card, t)) : cycleKey(t);
  const ongoing = !p.months; // 0 = รายเดือนไม่มีกำหนด (เช่น ค่าสมาชิก)
  const sinceFirst = monthsDiff(p.firstCycle, curKey) + 1;
  if (ongoing) return { ongoing, billed: Math.max(0, sinceFirst), remaining: 0, remainingAmt: 0, endKey: null, active: true };
  const billed = Math.max(0, Math.min(p.months, sinceFirst));
  const remaining = p.months - billed;
  return {
    billed, remaining, remainingAmt: remaining * p.monthly,
    endKey: addMonthsKey(p.firstCycle, p.months - 1), active: remaining > 0,
  };
}
function instForCycle(cardId, key) {
  return state.installments.filter((p) => p.cardId === cardId)
    .filter((p) => { const k = monthsDiff(p.firstCycle, key); return k >= 0 && (!p.months || k < p.months); })
    .reduce((s, p) => s + Number(p.monthly || 0), 0);
}
/** ประมาณยอดบิลรอบ key จากรายการใช้จ่ายที่บันทึก + ค่างวดผ่อน */
function estimateCycle(card, key) {
  const S = keyToStmt(card, key), prev = shiftCycle(card, S, -1);
  const tx = state.txns.filter((x) => x.cardId === card.id)
    .filter((x) => { const d = parseIso(x.date); return d > prev && d <= S; })
    .reduce((s, x) => s + Number(x.amount || 0), 0);
  const inst = instForCycle(card.id, key);
  return { tx, inst, total: tx + inst };
}
/** สถานะบิลรอบล่าสุดของบัตร */
function currentBill(card, t = today()) {
  const S = lastStmt(card, t), D = dueFor(card, S), key = cycleKey(S), st = findStmt(card.id, key);
  let status;
  if (st && (st.paid || Number(st.amount) <= 0)) status = 'paid';
  else if (t <= D) status = st ? 'due' : 'unknown';
  else status = st ? 'overdue' : 'closed';
  return { card, S, D, key, st, status, daysLeft: daysBetween(t, D), nextS: shiftCycle(card, S, 1) };
}
/** บิลที่ยังต้องจ่าย: บิลค้าง (ทุกรอบ) + บิลรอบปัจจุบันที่ยังไม่ได้กรอกยอด */
function pendingBills(t = today()) {
  const out = [];
  for (const st of state.statements) {
    const card = cardById(st.cardId);
    if (!hasDates(card) || st.paid || Number(st.amount) <= 0) continue;
    const S = keyToStmt(card, st.cycle), D = dueFor(card, S);
    out.push({ card, S, D, key: st.cycle, st, status: t > D ? 'overdue' : 'due', daysLeft: daysBetween(t, D) });
  }
  for (const card of datedCards()) {
    const b = currentBill(card, t);
    if (b.status === 'unknown') out.push(b);
  }
  return out.sort((a, b) => a.D - b.D);
}
function bestCardsToday(t = today()) {
  return datedCards().map((card) => {
    const S = stmtForPurchase(card, t), D = dueFor(card, S);
    return { card, S, D, free: daysBetween(t, D) };
  }).sort((a, b) => b.free - a.free);
}
function upcomingEvents(days = 31, t = today()) {
  const end = addDays(t, days), ev = [];
  for (const card of datedCards()) {
    for (let i = -1; i <= 2; i++) {
      const S = shiftCycle(card, lastStmt(card, t), i), D = dueFor(card, S);
      if (S >= t && S <= end) ev.push({ type: 'stmt', date: S, card });
      if (D >= t && D <= end) {
        const st = findStmt(card.id, cycleKey(S));
        ev.push({ type: 'due', date: D, card, st, key: cycleKey(S) });
      }
    }
  }
  return ev.sort((a, b) => a.date - b.date || (a.type === 'stmt' ? -1 : 1));
}
/** ยอดใช้จ่ายรอบปัจจุบัน (ยังไม่ตัดรอบ) ของบัตร — ถ้ายังไม่ตั้งวันตัดรอบ ใช้ยอดเดือนนี้ */
function cycleSpend(card, t = today()) {
  let from, to = null;
  if (hasDates(card)) { from = lastStmt(card, t); to = stmtForPurchase(card, addDays(t, 1)); }
  else from = new Date(t.getFullYear(), t.getMonth(), 0);
  const list = state.txns.filter((x) => x.cardId === card.id).filter((x) => { const d = parseIso(x.date); return d > from && (!to || d <= to); });
  return { amount: list.reduce((s, x) => s + Number(x.amount || 0), 0), count: list.length, cutDate: to };
}
function monthTxns(key) { return state.txns.filter((x) => x.date.slice(0, 7) === key); }
function statusBadge(b) {
  if (b.status === 'paid') return '<span class="badge b-ok">ชำระแล้ว</span>';
  if (b.status === 'overdue') return `<span class="badge b-danger">เลยกำหนด ${-b.daysLeft} วัน</span>`;
  if (b.status === 'unknown') return `<span class="badge ${b.daysLeft <= 3 ? 'b-warn' : 'b-muted'}">ยังไม่กรอกยอด · ${relDays(b.daysLeft)}</span>`;
  if (b.status === 'due') return `<span class="badge ${b.daysLeft <= 3 ? 'b-warn' : 'b-info'}">${relDays(b.daysLeft)}</span>`;
  return '<span class="badge b-muted">ไม่มีบิลค้าง</span>';
}

    h += `<div class="card list">` + list.map(instRow).join('') + `</div>`;
  }
  if (done.length) h += `<h2 class="muted">ผ่อนครบแล้ว (${done.length})</h2><div class="card list">` + done.map(instRow).join('') + `</div>`;
  return h;
}
function instRow({ p, s }) {
  if (s.ongoing) {
    return `<div class="row clickable" data-act="inst-edit" data-id="${p.id}">
    <div class="grow"><div class="title">${esc(p.name)}</div>
      <div class="meta">รายเดือน · ไม่มีกำหนดสิ้นสุด</div></div>
    <div class="amt">${money(p.monthly)}<div class="meta">ต่อเนื่อง</div></div></div>`;
  }
  const pct = (s.billed / p.months) * 100;
  return `<div class="row clickable" data-act="inst-edit" data-id="${p.id}">
    <div class="grow"><div class="title">${esc(p.name)}</div>
      <div class="meta">งวด ${s.billed}/${p.months} · ${p.rate ? 'ดอกเบี้ย ' + p.rate + '%' : '0%'} · งวดสุดท้าย ${fmtKey(s.endKey)}</div>
      <div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
    <div class="amt">${money(p.monthly)}<div class="meta">เหลือ ${money(s.remainingAmt)}</div></div></div>`;
}

function renderTxn() {
  const all = state.txns.filter((x) => txnCard === 'all' || x.cardId === txnCard);
  const list = all.filter((x) => x.date.slice(0, 7) === txnMonth).sort((a, b) => b.date.localeCompare(a.date));
  const total = list.reduce((s, x) => s + Number(x.amount), 0);
  let h = `<h2>สรุปการใช้จ่าย<span class="sp"></span>
    <button class="btn sm" data-act="import" ${state.cards.length ? '' : 'disabled'}>⬆ นำเข้า CSV</button>
    <button class="btn sm primary" data-act="txn-add" ${state.cards.length ? '' : 'disabled'}>+ เพิ่ม</button></h2>`;
  h += `<div class="toolbar">
    <button class="btn sm" data-act="month-prev">‹</button>
    <input type="month" id="txnMonth" value="${txnMonth}" style="flex:1;min-width:0">
    <button class="btn sm" data-act="month-next">›</button></div>`;
  h += `<div class="seg"><button class="btn sm ${txnCard === 'all' ? 'on' : ''}" data-act="txn-card" data-id="all">ทุกบัตร</button>` +
    state.cards.map((c) => `<button class="btn sm ${txnCard === c.id ? 'on' : ''}" data-act="txn-card" data-id="${c.id}">${esc(cardLabel(c).replace(/ ••\d{4}$/, ''))}</button>`).join('') + `</div>`;

  // กราฟ 6 เดือนย้อนหลัง
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const k = addMonthsKey(txnMonth, -i);
    months.push({ k, v: all.filter((x) => x.date.slice(0, 7) === k).reduce((s, x) => s + Number(x.amount), 0) });
  }
  const maxV = Math.max(1, ...months.map((m) => m.v));
  h += `<div class="card" style="margin-bottom:10px">
    <div class="pad" style="padding-bottom:0"><div class="muted small">ยอดใช้จ่าย ${fmtKey(txnMonth)}</div><div style="font-size:24px;font-weight:700">${money(total)}</div></div>
    <div class="months">${months.map((m) => `<div class="m ${m.k === txnMonth ? 'cur' : ''}"><i style="height:${(m.v / maxV) * 80}%"></i><span>${fmtKey(m.k)}</span></div>`).join('')}</div>
    <div class="months-v">${months.map((m) => `<span>${m.v ? (m.v >= 1000 ? (m.v / 1000).toFixed(1) + 'k' : Math.round(m.v)) : '-'}</span>`).join('')}</div></div>`;

  if (list.length) {
    const byCat = {};
    for (const x of list) byCat[x.category || 'other'] = (byCat[x.category || 'other'] || 0) + Number(x.amount);
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    h += `<h2 style="font-size:14px">ตามหมวดหมู่</h2><div class="card">` + cats.map(([c, v]) => `
      <div class="catbar"><span>${esc((CAT_BY_ID[c] || CAT_BY_ID.other).label)}</span><b class="amt">${money(v)} <span class="muted small">${total ? ((v / total) * 100).toFixed(0) : 0}%</span></b>
      <div class="bar"><i style="width:${total > 0 ? Math.max(0, (v / total) * 100) : 0}%"></i></div></div>`).join('') + `</div>`;
    if (txnCard === 'all' && state.cards.length > 1) {
      const byCard = {};
      for (const x of list) byCard[x.cardId] = (byCard[x.cardId] || 0) + Number(x.amount);
      h += `<h2 style="font-size:14px">ตามบัตร</h2><div class="card list">` + Object.entries(byCard).sort((a, b) => b[1] - a[1]).map(([cid, v]) => {
        const c = cardById(cid);
        return `<div class="row">${c ? chip(c) : ''}<div class="grow title">${c ? esc(cardLabel(c)) : 'บัตรที่ถูกลบ'}</div><div class="amt">${money(v)}</div></div>`;
      }).join('') + `</div>`;
    }
  }
  h += `<h2 style="font-size:14px">รายการ (${list.length})</h2>`;
  if (!list.length) h += `<div class="card empty">ไม่มีรายการในเดือนนี้<br><span class="small">กดปุ่ม ＋ มุมขวาล่างเพื่อบันทึก</span></div>`;
  else h += `<div class="card list">` + list.map((x) => {
    const c = cardById(x.cardId);
    return `<div class="row clickable" data-act="txn-edit" data-id="${x.id}">${c ? chip(c) : ''}
      <div class="grow"><div class="title">${esc(x.desc || '(ไม่มีชื่อ)')}</div>
      <div class="meta">${fmtD(parseIso(x.date))} · ${esc((CAT_BY_ID[x.category] || CAT_BY_ID.other).label)}</div></div>
      <div class="amt" style="${Number(x.amount) < 0 ? 'color:var(--ok)' : ''}">${money(x.amount)}</div></div>`;
  }).join('') + `</div>`;
  return h;
}

/* ============================== ฟอร์ม (sheet) ============================== */
const sheet = document.getElementById('sheet');
let sheetSubmit = null;
function openSheet(title, body, onSubmit, footer) {
  sheetSubmit = onSubmit;
  sheet.innerHTML = `<form id="sheetForm" novalidate>
    <div class="sheet-h"><b>${title}</b><button type="button" class="x" data-act="close" aria-label="ปิด">×</button></div>
    <div class="sheet-b">${body}
    ${footer !== undefined ? footer : `<button class="btn primary block" type="submit">บันทึก</button>`}</div></form>`;
  if (!sheet.open) sheet.showModal();
}
function closeSheet() { if (sheet.open) sheet.close(); sheetSubmit = null; }
sheet.addEventListener('submit', (e) => {
  e.preventDefault();
  if (!sheetSubmit) return;
  const fd = Object.fromEntries(new FormData(e.target).entries());
  e.target.querySelectorAll('input[type=checkbox]').forEach((c) => { fd[c.name] = c.checked; });
  if (sheetSubmit(fd) !== false) closeSheet();
});
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });

const cardOptions = (sel) => state.cards.map((c) => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(cardLabel(c))}</option>`).join('');
const num = (v) => { const n = parseFloat(String(v ?? '').replace(/[,฿\s]/g, '')); return isFinite(n) ? n : 0; };
const dayNum = (v) => { const n = parseInt(v, 10); return n >= 1 && n <= 31 ? n : null; };

function cardForm(card) {
  const c = card || { issuer: 'kbank', name: '', last4: '', limit: '', statementDay: '', dueDay: '', color: '', note: '' };
  openSheet(card ? 'แก้ไขบัตร' : 'เพิ่มบัตร', `
    <label class="f"><span>ธนาคาร / ผู้ออกบัตร</span><select name="issuer">${Object.entries(ISSUERS).map(([k, v]) => `<option value="${k}" ${k === c.issuer ? 'selected' : ''}>${esc(v.name)}${v.app ? ' — ' + esc(v.app) : ''}</option>`).join('')}</select></label>
    <label class="f"><span>ชื่อบัตร</span><input name="name" value="${esc(c.name)}" placeholder="เช่น The Wisdom, M Visa, SPayLater" required></label>
    <div class="grid2">
      <label class="f"><span>วันตัดรอบบัญชี (1–31)</span><input name="statementDay" value="${esc(c.statementDay)}" inputmode="numeric" required></label>
      <label class="f"><span>วันครบกำหนดชำระ (1–31)</span><input name="dueDay" value="${esc(c.dueDay)}" inputmode="numeric" required></label>
    </div>
    <p class="hint">ดูได้จากใบแจ้งยอด (Statement date / Payment due date) ถ้าเดือนไหนไม่มีวันที่นั้น จะใช้วันสุดท้ายของเดือน</p>
    <label class="f"><span>เลข 4 หลักท้าย (ไม่บังคับ)</span><input name="last4" value="${esc(c.last4)}" maxlength="4" inputmode="numeric" pattern="[0-9]*"></label>
    <label class="f"><span>สีบัตร (ไม่บังคับ)</span><input name="color" type="color" value="${esc(c.color || ISSUERS[c.issuer]?.color || '#475569')}"></label>
    <label class="f"><span>หมายเหตุ</span><input name="note" value="${esc(c.note || '')}" placeholder="เช่น ใช้เติมน้ำมัน, cashback 5%"></label>
    ${card ? `<button type="button" class="btn danger block" style="margin-bottom:10px" data-act="card-del" data-id="${card.id}">ลบบัตรนี้</button>` : ''}`,
  (f) => {
    const sd = dayNum(f.statementDay), dd = dayNum(f.dueDay);
    if (!f.name.trim()) return toast('กรุณากรอกชื่อบัตร'), false;
    if (!sd || !dd) return toast('วันตัดรอบ/วันครบกำหนดต้องเป็น 1–31'), false;
    if (f.last4 && !/^\d{4}$/.test(f.last4)) return toast('เลขท้ายต้องเป็นตัวเลข 4 หลัก'), false;
    const data = { issuer: f.issuer, name: f.name.trim(), last4: f.last4, statementDay: sd, dueDay: dd, color: f.color === ISSUERS[f.issuer].color ? '' : f.color, note: f.note };
    if (card) Object.assign(card, data); else state.cards.push({ id: uid(), ...data });
    save(); toast('บันทึกบัตรแล้ว');
  });
  const issuerSel = sheet.querySelector('[name=issuer]'), colorIn = sheet.querySelector('[name=color]');
  issuerSel.addEventListener('change', () => { colorIn.value = ISSUERS[issuerSel.value].color; });
}

function cardView(card) {
  if (!hasDates(card)) return cardForm(card);
  const t = today(), b = currentBill(card, t);
  const hist = state.statements.filter((s) => s.cardId === card.id).sort((a, z) => z.cycle.localeCompare(a.cycle));
  const insts = state.installments.filter((p) => p.cardId === card.id && instStatus(p, t).active);
  const best = bestCardsToday(t).find((x) => x.card.id === card.id);
  openSheet(esc(cardLabel(card)), `

      <div class="card tile"><div class="lbl">รอบบิลล่าสุด</div><div class="val" style="font-size:16px">${fmtDY(b.S)}</div><div class="sub">ครบกำหนด ${fmtDY(b.D)}</div></div>

    </div>
    <p>สถานะรอบนี้: ${statusBadge(b)} ${b.st ? money(b.st.amount) : ''}</p>

    <div class="btns" style="margin-bottom:14px">

    }).join('')}</div>` : '<div class="card empty">ยังไม่มีประวัติบิล</div>'}`, null, '');
}

  key = key || cycleKey(lastStmt(card));

  openSheet(st ? 'แก้ไขยอดบิล' : 'กรอกยอดบิล', `

      <label class="f"><span>ยอดเรียกเก็บ (บาท)</span><input name="amount" value="${st ? st.amount : ''}" inputmode="decimal" required></label>
      <label class="f"><span>ยอดขั้นต่ำ (บาท)</span><input name="minPay" value="${st ? st.minPay || '' : ''}" inputmode="decimal"></label>
    </div>
    <p class="hint" id="stmtEst"></p>
    <label class="check"><input type="checkbox" name="paid" ${st && st.paid ? 'checked' : ''}> ชำระแล้ว</label>
    <label class="f"><span>ยอดที่ชำระ (ถ้าจ่ายไม่เต็ม)</span><input name="paidAmount" value="${st && st.paidAmount ? st.paidAmount : ''}" inputmode="decimal"></label>

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  const delim = (text.split('\n')[0].match(/\t/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? '\t' : ',';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') q = false;
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.some((c) => c.trim() !== '')) rows.push(row);
      row = [];
    } else cell += ch;
  }
  row.push(cell);
  if (row.some((c) => c.trim() !== '')) rows.push(row);
  return rows;
}
const TH_MON_RE = { 'ม.ค': 1, 'ก.พ': 2, 'มี.ค': 3, 'เม.ย': 4, 'พ.ค': 5, 'มิ.ย': 6, 'ก.ค': 7, 'ส.ค': 8, 'ก.ย': 9, 'ต.ค': 10, 'พ.ย': 11, 'ธ.ค': 12 };
function normYear(y) {
  y = parseInt(y, 10);
  if (y < 100) y = y >= 50 ? 2500 + y : 2000 + y; // 2 หลัก: 68 = พ.ศ. 2568, 25 = ค.ศ. 2025
  if (y > 2400) y -= 543;
  return y;
}
function parseDateLoose(s) {
  s = String(s || '').trim();
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return validDate(normYear(m[1]), +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))) return validDate(normYear(m[3]), +m[2], +m[1]);
  if ((m = s.match(/^(\d{1,2})\s*([ก-๙]{1,3}\.[ก-๙]{1,2})\.?\s*(\d{2,4})/))) {
    const mon = TH_MON_RE[m[2].replace(/\.$/, '')];
    if (mon) return validDate(normYear(m[3]), mon, +m[1]);
  }
  return null;
}
function validDate(y, mo, d) {
  if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
  const dt = new Date(y, mo - 1, d);
  return dt.getMonth() === mo - 1 ? iso(dt) : null;
}
function mapCsv(rows) {
  if (!rows.length) return { items: [], skipped: 0 };
  const head = rows[0].map((h) => h.trim().toLowerCase());
  const find = (re) => head.findIndex((h) => re.test(h));
  let di = find(/date|วันที่|วันทำรายการ/), ai = find(/amount|จำนวน|ยอด|บาท|thb/), ti = find(/desc|รายการ|detail|merchant|ร้าน|รายละเอียด/), ci = find(/cat|หมวด/);
  let start = 1;
  if (di < 0 || ai < 0) { di = 0; ti = 1; ai = 2; ci = -1; start = parseDateLoose(rows[0][0]) ? 0 : 1; }
  const items = []; let skipped = 0;
  for (const r of rows.slice(start)) {
    const date = parseDateLoose(r[di]);
    const raw = String(r[ai] ?? '').trim();
    const neg = /^\(.*\)$/.test(raw) || /cr$/i.test(raw);
    let amount = num(raw.replace(/[()]|cr$/gi, ''));
    if (neg) amount = -Math.abs(amount);
    if (!date || !raw || !isFinite(amount) || amount === 0) { skipped++; continue; }
    const desc = ti >= 0 ? String(r[ti] ?? '').trim() : '';
    const catRaw = ci >= 0 ? String(r[ci] ?? '').trim() : '';
    const cat = CATS.find((c) => c.id === catRaw || c.label.includes(catRaw) && catRaw) ? CATS.find((c) => c.id === catRaw || c.label.includes(catRaw)).id : guessCat(desc);
    items.push({ date, amount, desc, category: cat });
  }
  return { items, skipped };
}

function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/[,;]/g, (m) => '\\' + m).replace(/\n/g, '\\n'); }
function buildIcs(includeStmt) {
  const t = today(), stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MyCards//TH', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:บัตรเครดิต - กำหนดชำระ'];
  const ymd = (d) => iso(d).replace(/-/g, '');
  for (const card of datedCards()) {
    for (let i = 0; i < 12; i++) {
      const S = shiftCycle(card, lastStmt(card, t), i), D = dueFor(card, S);
      if (D >= t) {
        lines.push('BEGIN:VEVENT', `UID:${card.id}-${ymd(D)}-due@mycards`, `DTSTAMP:${stamp}`,
          `DTSTART;VALUE=DATE:${ymd(D)}`, `DTEND;VALUE=DATE:${ymd(addDays(D, 1))}`,
          `SUMMARY:${icsEscape('💰 ครบกำหนดชำระ ' + cardLabel(card))}`,
          `DESCRIPTION:${icsEscape('บิลรอบตัดวันที่ ' + fmtDY(S) + ' — เปิดแอปบัตรของฉันเพื่อดูยอด')}`,
          'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:ใกล้ครบกำหนดชำระบัตร', 'TRIGGER:-P2DT15H', 'END:VALARM',
          'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:พรุ่งนี้ครบกำหนดชำระบัตร', 'TRIGGER:-PT15H', 'END:VALARM',
          'END:VEVENT');
      }
      if (includeStmt && S >= t) {
        lines.push('BEGIN:VEVENT', `UID:${card.id}-${ymd(S)}-stmt@mycards`, `DTSTAMP:${stamp}`,
          `DTSTART;VALUE=DATE:${ymd(S)}`, `DTEND;VALUE=DATE:${ymd(addDays(S, 1))}`,
          `SUMMARY:${icsEscape('✂️ ตัดรอบบัตร ' + cardLabel(card))}`, 'TRANSP:TRANSPARENT', 'END:VEVENT');
      }
    }
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;

async function showNotif(title, body, tag) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;

  try {

async function checkNotifications() {
  if (isLocked()) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const todayKey = iso(today()), notified = state.settings.notified;
  let changed = false;
  for (const a of alertItems()) {

/* ============================== Apps Script sync ============================== */
function buildSyncPayload() {
  const t = today(), ev = [], seen = new Set();
  const push = (card, S) => {
    const D = dueFor(card, S), key = cycleKey(S), id = card.id + key;
    if (seen.has(id)) return; seen.add(id);
    const st = findStmt(card.id, key);
    ev.push([iso(D), 'd', cardLabel(card), st ? st.amount : null, st ? st.minPay || 0 : null, st && (st.paid || Number(st.amount) <= 0) ? 1 : 0]);
  };
  for (const st of state.statements) {
    const card = cardById(st.cardId);
    if (hasDates(card) && !st.paid && Number(st.amount) > 0 && dueFor(card, keyToStmt(card, st.cycle)) < t) push(card, keyToStmt(card, st.cycle));
  }
  for (const card of datedCards()) {
    for (let i = -1; i <= 4; i++) {
      const S = shiftCycle(card, lastStmt(card, t), i);
      if (dueFor(card, S) >= addDays(t, -7)) push(card, S);
      if (S >= t) ev.push([iso(S), 's', cardLabel(card)]);
    }
  }
  const inst = state.installments.map((p) => [p, instStatus(p, t)]).filter(([, s]) => s.active)
    .reduce((s, [p]) => s + Number(p.monthly), 0);
  return { v: 1, at: new Date().toISOString(), remind: state.settings.remindDays, inst, ev };
}
async function gasCall(action, extra = {}) {
  const { gasUrl, syncKey } = state.settings;
  if (!gasUrl || !syncKey) throw new Error('ยังไม่ได้ตั้งค่า URL / SYNC_KEY');
  const res = await fetch(gasUrl, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, key: syncKey, data: buildSyncPayload(), ...extra }),
  });
  const out = await res.json().catch(() => { throw new Error('Apps Script ตอบกลับไม่ถูกต้อง (ตรวจสอบสิทธิ์ “ทุกคน”)'); });
  if (!out.ok) throw new Error(out.error || 'ซิงก์ไม่สำเร็จ');
  return out;
}
let syncTimer = null;
function scheduleSync() {
  if (!state.settings.gasUrl || !state.settings.syncKey) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, 1500);
}
async function syncNow(silent = true) {
  try {
    await gasCall('sync');
    state.settings.lastSync = new Date().toISOString(); state.settings.lastSyncError = '';
    if (!silent) toast('☁️ ซิงก์กับ Apps Script แล้ว');
  } catch (e) {
    state.settings.lastSyncError = e.message || String(e);
    if (!silent) toast('⚠ ' + state.settings.lastSyncError);
  }
  persist();
  if (tab === 'settings') render();
}

/* ============================== ข้อมูลตัวอย่าง ============================== */
function loadDemo() {
  const t = today(), c = (issuer, name, last4, limit, sd, dd) => ({ id: uid(), issuer, name, last4, limit, statementDay: sd, dueDay: dd, color: '', note: '' });
  // บัตรตัวอย่าง (สมมติ)
  const cards = [
    c('ktc', 'KTC ตัวอย่าง', '1111', 0, 20, 5), c('kbank', 'กสิกรไทย ตัวอย่าง', '2222', 0, 10, 25),
    c('scb', 'SCB ตัวอย่าง', '3333', 0, 18, 8), c('uob', 'UOB ตัวอย่าง', '4444', 0, 15, 5),
    c('bbl', 'กรุงเทพ ตัวอย่าง', '5555', 0, 28, 15), c('ttb', 'ttb ตัวอย่าง', '6666', 0, 5, 25), c('spay', 'SPayLater', '', 0, 25, 10),
  ];
  const statements = [], txns = [], installments = [];
  for (const card of cards) {
    const S = lastStmt(card, t), prevS = shiftCycle(card, S, -1);
    const amt = Math.round(3000 + Math.random() * 22000);
    statements.push({ id: uid(), cardId: card.id, cycle: cycleKey(prevS), amount: Math.round(2000 + Math.random() * 15000), minPay: 0, paid: true, paidAmount: 0, paidDate: '' });
    if (card.issuer !== 'bbl' && card.issuer !== 'lazada') statements.push({ id: uid(), cardId: card.id, cycle: cycleKey(S), amount: amt, minPay: Math.round(amt * 0.08), paid: card.issuer === 'uob', paidAmount: 0, paidDate: '' });
  }
  // บิลค้างจากรอบก่อนของ KTC เพื่อให้เห็นตัวอย่าง "เลยกำหนด"
  for (const st of statements) {
    const card = cards.find((x) => x.id === st.cardId);
    if (dueFor(card, keyToStmt(card, st.cycle)) < t) st.paid = true;
  }
  const ktc = cards[0], ktcPrev = findIn(statements, ktc.id, cycleKey(shiftCycle(ktc, lastStmt(ktc, t), -1)));
  if (ktcPrev && dueFor(ktc, keyToStmt(ktc, ktcPrev.cycle)) < t) ktcPrev.paid = false;
  const shops = [['HOMEPRO', 'shop'], ['CENTRAL FOOD HALL', 'grocery'], ['BANGCHAK', 'travel'], ['SHOPEE', 'online'], ['7-ELEVEN', 'grocery'], ['PTT STATION', 'travel'], ['GRAB FOOD', 'food'], ['STARBUCKS', 'food'], ['LOTUS', 'grocery'], ['NETFLIX.COM', 'ent'], ['LAZADA', 'online'], ['AIS POSTPAID', 'bills'], ['CENTRAL CHIANGMAI', 'shop'], ['WATSONS', 'health'], ['AGODA', 'trip'], ['PET SHOP', 'pet']];
  for (let i = 0; i < 160; i++) {
    const [desc, category] = shops[Math.floor(Math.random() * shops.length)];
    const d = addDays(t, -Math.floor(Math.random() * 170));
    const amount = category === 'trip' ? Math.round(1500 + Math.random() * 6000) : category === 'bills' ? 599 : Math.round(60 + Math.random() * 1800);
    txns.push({ id: uid(), cardId: cards[Math.floor(Math.random() * cards.length)].id, date: iso(d), amount, desc, category });
  }
  const mk = (card, name, monthly, months, term, rate = 0) => installments.push({ id: uid(), cardId: card.id, name, monthly, months, rate, firstCycle: addMonthsKey(cycleKey(lastStmt(card, t)), -(term - 1)) });
  mk(cards[2], 'iPhone 17 Pro', 4383, 10, 4); mk(cards[5], 'แอร์ Daikin 18000 BTU', 1650, 10, 9);
  mk(cards[0], 'ประกันรถยนต์ชั้น 1', 2150, 6, 2); mk(cards[6], 'โซฟา', 1790, 10, 10);
  mk(cards[4], 'หูฟัง', 690, 3, 1, 0); mk(cards[3], 'ตู้เย็น', 1290, 10, 3);
  state = Object.assign(blankState(), { cards, statements, installments, txns, settings: state.settings });
  save({ noSync: true });
  toast('โหลดข้อมูลตัวอย่างแล้ว');
}
function findIn(arr, cardId, key) { return arr.find((s) => s.cardId === cardId && s.cycle === key); }

/* ============================== event ============================== */
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'txnMonth' && /^\d{4}-\d{2}$/.test(e.target.value)) { txnMonth = e.target.value; render(); }
  if (e.target.id === 'remindDays') {
    const arr = [...new Set(e.target.value.split(/[,\s]+/).map((x) => parseInt(x, 10)).filter((x) => x >= 0 && x <= 30))].sort((a, b) => b - a);
    state.settings.remindDays = arr.length ? arr : [3, 1, 0];
    save(); toast('บันทึกแล้ว');
  }
  if (e.target.id === 'restoreFile' && e.target.files[0]) {
    e.target.files[0].text().then((txt) => {
      try {
        const s = JSON.parse(txt);
        if (!s || !Array.isArray(s.cards)) throw new Error();
        if (!confirm(`กู้คืนข้อมูล ${s.cards.length} บัตร? ข้อมูลปัจจุบันในเครื่องจะถูกแทนที่`)) return;
        const b = blankState();
        state = Object.assign(b, s, { settings: Object.assign(b.settings, s.settings || {}) });
        save(); toast('กู้คืนข้อมูลแล้ว');
      } catch (err) { toast('ไฟล์ไม่ถูกต้อง'); }
    });
  }
});
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const { act, id } = el.dataset;
  switch (act) {
    case 'close': closeSheet(); break;
    case 'demo':
      if (state.cards.length && !confirm('แทนที่ข้อมูลปัจจุบันด้วยข้อมูลตัวอย่าง?')) return;
      loadDemo(); break;
    case 'card-add': cardForm(); break;
    case 'lock-set': {
      const pw = document.getElementById('newLockPw').value;
      if (pw.length < 4) return toast('รหัสผ่านอย่างน้อย 4 ตัว');
      await setLockPassword(pw); markUnlocked(); toast('ตั้งรหัสผ่านและเปิดล็อกแล้ว'); render(); break;
    }
    case 'lock-now':
      try { sessionStorage.removeItem('mycards.unlocked'); } catch (err) { /* ignore */ }
      unlockedMem = false; render(); break;
    case 'lock-off':
      if (!confirm('ปิดการล็อกแอป?')) return;
      state.settings.lock.enabled = false; persist(); toast('ปิดล็อกแล้ว'); render(); break;
    case 'go-cards': tab = 'cards'; render(); break;
    case 'card-edit': cardForm(cardById(id)); break;
    case 'card-view': cardView(cardById(id)); break;
    case 'card-del': {
      const c = cardById(id);
      if (!confirm(`ลบบัตร ${cardLabel(c)} พร้อมบิล รายการผ่อน และรายการใช้จ่ายของบัตรนี้?`)) return;
      state.cards = state.cards.filter((x) => x.id !== id);
      state.statements = state.statements.filter((x) => x.cardId !== id);
      state.installments = state.installments.filter((x) => x.cardId !== id);
      state.txns = state.txns.filter((x) => x.cardId !== id);
      if (txnCard === id) txnCard = 'all';
      closeSheet(); save(); toast('ลบบัตรแล้ว'); break;
    }
    case 'stmt-edit': stmtForm(el.dataset.card, el.dataset.key); break;
    case 'stmt-del':
      if (!confirm('ลบบิลรอบนี้?')) return;
      state.statements = state.statements.filter((s) => !(s.cardId === el.dataset.card && s.cycle === el.dataset.key));
      closeSheet(); save(); break;
    case 'use-est': sheet.querySelector('[name=amount]').value = el.dataset.v; break;
    case 'mark-paid': {
      const st = findStmt(el.dataset.card, el.dataset.key);
      if (st) { st.paid = true; st.paidDate = iso(today()); save(); toast('✓ บันทึกว่าชำระแล้ว'); }
      break;
    }
    case 'inst-add': instForm(); break;
    case 'inst-edit': instForm(state.installments.find((p) => p.id === id)); break;
    case 'inst-del':
      if (!confirm('ลบรายการผ่อนนี้?')) return;
      state.installments = state.installments.filter((p) => p.id !== id); closeSheet(); save(); break;
    case 'txn-add': txnForm(null, el.dataset.card); break;
    case 'pick-desc': {
      const form = sheet.querySelector('form');
      form.desc.value = el.dataset.desc;
      if (CAT_BY_ID[el.dataset.cat]) form.category.value = el.dataset.cat;
      break;
    }
    case 'txn-edit': txnForm(state.txns.find((x) => x.id === id)); break;
    case 'txn-del':
      state.txns = state.txns.filter((x) => x.id !== id); closeSheet(); save(); break;
    case 'txn-card': txnCard = id; render(); break;
    case 'month-prev': txnMonth = addMonthsKey(txnMonth, -1); render(); break;
    case 'month-next': txnMonth = addMonthsKey(txnMonth, 1); render(); break;
    case 'import': importForm(); break;
    case 'notif-enable':
      if (!('Notification' in window)) return toast('อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน (iPhone ต้องเพิ่มไปหน้าจอโฮมก่อน)');
      if ((await Notification.requestPermission()) === 'granted') { toast('เปิดการแจ้งเตือนแล้ว'); checkNotifications(); }
      else toast('ไม่ได้รับอนุญาตให้แจ้งเตือน');
      render(); break;
    case 'notif-test': {
      const items = alertItems();
      const ok = await showNotif(items[0] ? items[0].title : '🔔 ทดสอบการแจ้งเตือน', items[0] ? items[0].body : 'การแจ้งเตือนทำงานปกติ', 'test');
      if (!ok) toast('ยังไม่ได้เปิดการแจ้งเตือน'); break;
    }
    case 'ics': download('credit-card-due-dates.ics', buildIcs(document.getElementById('icsStmt').checked), 'text/calendar;charset=utf-8'); break;
    case 'gas-save':
      state.settings.gasUrl = document.getElementById('gasUrl').value.trim();
      state.settings.syncKey = document.getElementById('syncKey').value.trim();
      persist();
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(state.settings.gasUrl)) return toast('URL ต้องเป็น https://script.google.com/.../exec'), render();
      toast('กำลังซิงก์…'); syncNow(false); break;
    case 'gas-test':
      try { await gasCall('test'); toast('ส่งข้อความทดสอบแล้ว ตรวจสอบอีเมล/LINE'); }
      catch (err) { toast('⚠ ' + err.message); }
      break;
    case 'backup': download(`mycards-backup-${iso(today())}.json`, JSON.stringify(state, null, 1), 'application/json'); break;
    case 'wipe':
      if (!confirm('ลบข้อมูลทั้งหมดในเครื่องนี้? (ควรสำรองข้อมูลก่อน)')) return;
      state = blankState(); save({ noSync: true }); toast('ลบข้อมูลแล้ว'); break;
  }
});

/* ============================== เริ่มต้น ============================== */
// ล้างข้อมูลจากระบบ e-Statement เดิม (รหัส PDF / รายการอีเมล) ที่เลิกใช้แล้ว
try { localStorage.removeItem('mycards.pw'); } catch (e) { /* ignore */ }
['sourceMap', 'imported', 'mailItems', 'mailCheckedAt', 'estmtDays'].forEach((k) => { delete state.settings[k]; });
render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js').then(() => checkNotifications()).catch(() => {});
} else checkNotifications();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { render(); checkNotifications(); }
});
// ซิงก์วันละครั้งเมื่อเปิดแอป เพื่อให้ Apps Script มีข้อมูลรอบบิลใหม่เสมอ
if (state.settings.gasUrl && state.settings.syncKey && (!state.settings.lastSync || daysBetween(new Date(state.settings.lastSync), new Date()) >= 1)) scheduleSync();
</script>
